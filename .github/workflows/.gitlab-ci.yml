name: Laravel Deploy to Linux Server

on:
  push:
    branches:
      - dev
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Select environment based on branch
    environment: ${{ github.ref_name == 'master' && 'production' || github.ref_name == 'dev' && 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          port: ${{ vars.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          timeout: 30s
          command_timeout: 10m
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            git fetch origin ${{ vars.BRANCH_NAME }}
            git checkout dev
            git pull origin ${{ vars.BRANCH_NAME }}